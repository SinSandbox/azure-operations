name: Cleanup Untagged Non-VM Resources

# 1) Logs in to the target Azure subscription and queries the set of resources that do NOT carry
#    a "Do Not Delete" tag, do NOT carry a tag named "Action" with value "Do Not Delete", are NOT
#    Virtual Machines (Microsoft.Compute/virtualMachines), and do NOT live in a resource group
#    tagged "Do Not Delete", "default-activitylogalerts", or "governanceoperationsrg" (tag key
#    match is case-insensitive; the tag's value is irrelevant except for the Action tag).
# 2) Publishes that candidate list (job summary + artifact) for human review, then gates the
#    deletion job behind a GitHub Environment approval (required reviewers) so nothing is deleted
#    without sign-off.
# 3) Deletes the approved candidate resources, then pauses again behind an explicit manual
#    approval gate before the confirm job is allowed to run.
# 4) Outputs the full set of resources that remain in the subscription after cleanup.
# 5) Queries every resource group in the subscription that contains zero resources ("empty"),
#    excluding any resource group carrying a tag whose VALUE is "Do Not Delete" (case-insensitive;
#    any tag key qualifies).
# 6) Publishes that empty-resource-group candidate list for human review, then gates the deletion
#    job behind the same GitHub Environment approval (required reviewers) before removing anything.
# 7) Deletes the approved empty resource groups, then pauses again behind an explicit manual
#    approval gate before the confirm job is allowed to run.
# 8) Outputs the full set of resource groups that remain in the subscription after cleanup.
#
# Requires a GitHub Environment named to match the `environment` input (default: dev) configured
# with these secrets:
#   AZURE_MI_CLIENT_ID  - client ID of the federated (OIDC) managed identity / app registration
#   AZURE_TENANT_ID     - Entra ID tenant ID
#   AZURE_SUB_ID        - target Azure subscription ID
#
# The federated identity must have Azure RBAC Reader (discovery/confirmation) and Contributor (or
# higher, to delete resources/resource groups) at subscription scope.
#
# Approval gates: configure the GitHub Environment used by every job in this workflow (default:
# dev) with "Required reviewers" under Settings > Environments. Because every job below declares
# `environment: ${{ inputs.environment }}`, each one pauses independently for manual approval,
# including:
#   - the `delete` and `delete-empty-resource-groups` jobs, so a human views and approves the
#     published candidate list before anything is removed, and
#   - the `approve-deletion-confirmation` and `approve-empty-rg-deletion-confirmation` jobs, an
#     explicit additional manual approval step that must be satisfied before the corresponding
#     confirm job is allowed to run.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment to run against (maps to environment secrets and the approval gate).'
        type: choice
        options:
          - dev
        default: dev
      dryRun:
        description: 'Log intended deletions without actually deleting any resource.'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-untagged-non-vm-resources-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  discover:
    name: 1 - Query resources without "Do Not Delete" tag (excluding VMs and protected resource groups)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    outputs:
      candidate_count: ${{ steps.find.outputs.candidate_count }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Find resources missing "Do Not Delete" tag, excluding VMs and protected resource groups (find-deletable-resources.sh)
        id: find
        run: bash automation/scripts/find-deletable-resources.sh

      - name: Upload candidate resource list for review
        uses: actions/upload-artifact@v4
        with:
          name: deletable-resources-${{ github.run_number }}
          path: |
            deletable-resources.json
            deletable-resources-summary.md
          if-no-files-found: error

  delete:
    name: 2/3 - Review, approve, and delete candidate resources
    needs: discover
    runs-on: ubuntu-latest
    # Re-using the same GitHub Environment as the approval gate: configure "Required reviewers" on
    # this environment so the job pauses here until a human reviews the discover job's summary and
    # approves the deployment.
    environment: ${{ github.event.inputs.environment }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}
      DRY_RUN: ${{ github.event.inputs.dryRun }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Download reviewed candidate resource list
        uses: actions/download-artifact@v4
        with:
          name: deletable-resources-${{ github.run_number }}

      - name: Delete approved resources (delete-approved-resources.sh)
        run: bash automation/scripts/delete-approved-resources.sh

      - name: Upload deletion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deletion-results-${{ github.run_number }}
          path: deletion-results.json
          if-no-files-found: warn


  confirm:
    name: 4 - Confirm deletion and report remaining resources
    needs: delete
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Download reviewed candidate resource list
        uses: actions/download-artifact@v4
        with:
          name: deletable-resources-${{ github.run_number }}

      - name: Confirm deletion and list remaining resources (confirm-resource-deletion.sh)
        run: bash automation/scripts/confirm-resource-deletion.sh

      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-confirmation-${{ github.run_number }}
          path: |
            still-present-resources.json
            remaining-resources.json
            cleanup-confirmation-summary.md

  find-empty-resource-groups:
    name: 5 - Query empty resource groups (excluding tag value "Do Not Delete")
    needs: confirm
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    outputs:
      candidate_count: ${{ steps.find-empty-resource-groups.outputs.candidate_count }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Find empty resource groups, excluding tag value "Do Not Delete" (find-empty-resource-groups.sh)
        id: find-empty-resource-groups
        run: bash automation/scripts/find-empty-resource-groups.sh

      - name: Upload candidate empty resource group list for review
        uses: actions/upload-artifact@v4
        with:
          name: empty-resource-groups-${{ github.run_number }}
          path: |
            empty-resource-groups.json
            empty-resource-groups-summary.md
          if-no-files-found: error

  delete-empty-resource-groups:
    name: 6/7 - Review, approve, and delete candidate empty resource groups
    needs: find-empty-resource-groups
    runs-on: ubuntu-latest
    # Re-using the same GitHub Environment as the approval gate: configure "Required reviewers" on
    # this environment so the job pauses here until a human reviews the
    # find-empty-resource-groups job's summary and approves the deployment.
    environment: ${{ github.event.inputs.environment }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}
      DRY_RUN: ${{ github.event.inputs.dryRun }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Download reviewed candidate empty resource group list
        uses: actions/download-artifact@v4
        with:
          name: empty-resource-groups-${{ github.run_number }}

      - name: Delete approved empty resource groups (delete-empty-resource-groups.sh)
        run: bash automation/scripts/delete-empty-resource-groups.sh

      - name: Upload resource group deletion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-rg-deletion-results-${{ github.run_number }}
          path: empty-rg-deletion-results.json
          if-no-files-found: warn

  confirm-empty-resource-groups:
    name: 8 - Confirm resource group deletion and report remaining resource groups
    needs: delete-empty-resource-groups
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      AZURE_SUB_ID: ${{ secrets.AZURE_SUB_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUB_ID }}

      - name: Download reviewed candidate empty resource group list
        uses: actions/download-artifact@v4
        with:
          name: empty-resource-groups-${{ github.run_number }}

      - name: Confirm deletion and list remaining resource groups (confirm-empty-resource-group-deletion.sh)
        run: bash automation/scripts/confirm-empty-resource-group-deletion.sh

      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-rg-cleanup-confirmation-${{ github.run_number }}
          path: |
            still-present-resource-groups.json
            remaining-resource-groups.json
            empty-rg-cleanup-confirmation-summary.md
          if-no-files-found: warn
